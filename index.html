<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anantya Veda — Coming Soon</title>
  <meta name="description" content="anantyaveda.in — website under construction." />
  <style>
    :root {
      --bg: #f7f4ec;
      --bg-core: #ffffff;
      --fg: #1a1f26;
      --accent: #b8860b;
      --muted: #5b6470;
      --brand-green: #1f3d2b;
    }
    html.dark {
      --bg: #0f1419;
      --bg-core: #1a2330;
      --fg: #f5f0e6;
      --accent: #c8a24b;
      --muted: #9aa3ad;
      --brand-green: #8bbf9f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, var(--bg-core) 0%, var(--bg) 70%);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .card { max-width: 820px; width: 100%; }
    .brand {
      margin: 0 auto 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .brand-logo {
      width: 132px;
      height: 132px;
      display: block;
    }
    .brand-word {
      margin-top: 0.85rem;
      font-family: Georgia, 'Times New Roman', serif;
      font-weight: 700;
      letter-spacing: 0.18em;
      font-size: 1.6rem;
      color: var(--brand-green);
      line-height: 1.1;
    }
    .brand-word .sub {
      display: block;
      color: var(--accent);
      font-size: 1.1rem;
      letter-spacing: 0.32em;
      margin-top: 0.15rem;
    }
    .brand-tag {
      margin-top: 0.55rem;
      font-size: 0.7rem;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--muted);
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      letter-spacing: 0.04em;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .domain { color: var(--accent); }
    p.tagline {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .social {
      margin-top: 1.5rem;
    }
    .social-link {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, opacity 0.15s ease;
    }
    .social-link:hover { border-color: var(--accent); opacity: 0.8; }
    .social-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Contact buttons */
    .contact { margin-top: 2rem; }
    .contact h2 {
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.85rem;
    }
    .contact-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
    }
    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      border-radius: 999px;
      padding: 0.55rem 1.15rem;
      font-size: 0.9rem;
      letter-spacing: 0.03em;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    }
    .contact-btn:hover { background: var(--accent); color: var(--bg-core); transform: translateY(-1px); }
    .contact-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .contact-btn .ico { width: 1.05rem; height: 1.05rem; display: inline-flex; line-height: 1; }
    .contact-btn .ico svg { width: 100%; height: 100%; display: block; fill: currentColor; }

    /* Product tabs */
    .products { margin-top: 2.5rem; text-align: left; }
    .tablist {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .tab {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab:hover { opacity: 0.85; }
    .tab[aria-selected="true"] {
      background: var(--accent);
      color: var(--bg-core);
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .product {
      border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
      border-radius: 12px;
      padding: 1.1rem;
      background: color-mix(in srgb, var(--bg-core) 60%, var(--bg));
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .product h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--fg);
    }
    .product .desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }
    .product .price {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }
    .product-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      background: color-mix(in srgb, var(--muted) 15%, transparent);
      margin-bottom: 0.25rem;
    }
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .theme-toggle:hover { transform: scale(1.08); background: rgba(184,134,11,0.1); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
  <script>
    /* Apply saved theme before paint. Default is light; only go dark if explicitly chosen. */
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark mode" title="Toggle theme"></button>
  <main class="card">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 120 120" role="img" aria-label="Anantya Veda emblem">
        <defs>
          <radialGradient id="bg" cx="50%" cy="42%" r="60%">
            <stop offset="0%" stop-color="#fbf6ea" />
            <stop offset="100%" stop-color="#efe6d2" />
          </radialGradient>
        </defs>
        <circle cx="60" cy="60" r="56" fill="url(#bg)" stroke="#b8860b" stroke-width="2.5" />
        <circle cx="60" cy="60" r="50" fill="none" stroke="#b8860b" stroke-width="0.8" opacity="0.6" />
        <!-- lotus at top -->
        <g fill="#1f3d2b">
          <path d="M60 26 C57 34 57 40 60 44 C63 40 63 34 60 26 Z" />
          <path d="M50 30 C50 37 55 42 60 44 C56 40 53 34 50 30 Z" opacity="0.85" />
          <path d="M70 30 C70 37 65 42 60 44 C64 40 67 34 70 30 Z" opacity="0.85" />
        </g>
        <circle cx="60" cy="20" r="1.4" fill="#b8860b" />
        <circle cx="53" cy="22" r="1.1" fill="#b8860b" />
        <circle cx="67" cy="22" r="1.1" fill="#b8860b" />
        <!-- wordmark -->
        <text x="60" y="66" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#1f3d2b">ANANTYA</text>
        <text x="60" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="3" fill="#b8860b">VEDA</text>
        <!-- small lotus at bottom -->
        <g fill="none" stroke="#1f3d2b" stroke-width="1.4" stroke-linecap="round">
          <path d="M60 96 C57 92 57 88 60 86 C63 88 63 92 60 96 Z" />
          <path d="M53 94 C53 90 57 87 60 86" />
          <path d="M67 94 C67 90 63 87 60 86" />
        </g>
      </svg>
      <div class="brand-word">ANANTYA<span class="sub">VEDA</span></div>
      <div class="brand-tag">Natural &bull; Pure &bull; Timeless</div>
    </div>
    <h1><span class="domain">anantyaveda</span>.in</h1>
    <p class="tagline">Our website is currently under construction.<br />Please check back soon.</p>
    <span class="badge">Under Construction</span>
    <div class="contact" aria-labelledby="contact-heading">
      <h2 id="contact-heading">Contact Us</h2>
      <div class="contact-list">
        <a class="contact-btn" href="https://instagram.com/anantyaveda_9" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg></span>
          Instagram
        </a>
        <a class="contact-btn" href="https://wa.me/917410530609" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.71.306 1.263.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.288.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></span>
          WhatsApp
        </a>
        <a class="contact-btn" href="tel:+917410530609" aria-label="Call us">
          <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1c0 1.24.2 2.45.57 3.57a1 1 0 01-.24 1.02l-2.2 2.2z"/></svg></span>
          Call
        </a>
      </div>
    </div>
    <section class="products" aria-labelledby="products-heading">
      <div class="tablist" role="tablist" aria-label="Product categories">
        <button class="tab" role="tab" aria-selected="true" data-cat="all">All</button>
        <button class="tab" role="tab" aria-selected="false" data-cat="skin">Skin Care</button>
      </div>
      <div class="grid" id="productGrid"></div>
    </section>
    <div class="footer">&copy; <span id="year"></span> anantyaveda.in</div>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var isDark = document.documentElement.classList.contains('dark');
        btn.textContent = isDark ? '☀' : '☾'; /* sun when dark, moon when light */
        btn.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
      }
      sync();
      btn.addEventListener('click', function () {
        var nowDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', nowDark ? 'dark' : 'light'); } catch (e) {}
        sync();
      });
    })();

    /* Product list with category tabs */
    (function () {
      var products = [
        { name: 'Shat Dhaut Ghrit', cat: 'skin', img: '', desc: '100x-washed medicated ghee — cooling, deeply healing clarified butter for sensitive and irritated skin.', price: '30g ₹499 · 50g ₹599' },
        { name: 'Lip Balm', cat: 'skin', img: '', desc: 'Nourishing herbal lip balm that softens and protects dry, chapped lips.', price: '₹199' },
        { name: 'Manjishtha Mulethi Cream', cat: 'skin', img: '', desc: 'Brightening cream with manjishtha and liquorice (mulethi) for even, glowing skin tone.', price: '30g ₹599 · 50g ₹699' },
        { name: 'Manjishtha Lip Balm', cat: 'skin', img: '', desc: 'Tinted herbal lip balm enriched with manjishtha for naturally rosy lips.', price: '₹199' },
        { name: 'Manjishtha Soap', cat: 'skin', img: '', desc: 'Ayurvedic cleansing bar with manjishtha to clarify and brighten the skin.', price: '₹199' }
      ];
      var grid = document.getElementById('productGrid');
      function render(cat) {
        grid.innerHTML = '';
        products.filter(function (p) { return cat === 'all' || p.cat === cat; })
          .forEach(function (p) {
            var card = document.createElement('div');
            card.className = 'product';
            card.innerHTML =
              (p.img ? '<img class="product-img" src="' + p.img + '" alt="' + p.name + '" loading="lazy" />' : '') +
              '<h3>' + p.name + '</h3>' +
              '<p class="desc">' + p.desc + '</p>' +
              '<span class="price">' + p.price + '</span>';
            grid.appendChild(card);
          });
      }
      var tabs = document.querySelectorAll('.tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
          tab.setAttribute('aria-selected', 'true');
          render(tab.getAttribute('data-cat'));
        });
      });
      render('all');
    })();
  </script>
</body>
</html>
