<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anantya Veda — Coming Soon</title>
  <meta name="description" content="anantyaveda.in — website under construction." />
  <style>
    :root {
      --bg: #f7f4ec;
      --bg-core: #ffffff;
      --fg: #1a1f26;
      --accent: #b8860b;
      --muted: #5b6470;
    }
    html.dark {
      --bg: #0f1419;
      --bg-core: #1a2330;
      --fg: #f5f0e6;
      --accent: #c8a24b;
      --muted: #9aa3ad;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, var(--bg-core) 0%, var(--bg) 70%);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
    }
    .card { max-width: 820px; width: 100%; }
    h1 {
      font-size: clamp(2rem, 6vw, 3.25rem);
      letter-spacing: 0.04em;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .domain { color: var(--accent); }
    p.tagline {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      padding: 0.5rem 1.25rem;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .footer {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .social {
      margin-top: 1.5rem;
    }
    .social-link {
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s ease, opacity 0.15s ease;
    }
    .social-link:hover { border-color: var(--accent); opacity: 0.8; }
    .social-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Product tabs */
    .products { margin-top: 2.5rem; text-align: left; }
    .tablist {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .tab {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      font-size: 0.85rem;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .tab:hover { opacity: 0.85; }
    .tab[aria-selected="true"] {
      background: var(--accent);
      color: var(--bg-core);
    }
    .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }
    .product {
      border: 1px solid color-mix(in srgb, var(--muted) 35%, transparent);
      border-radius: 12px;
      padding: 1.1rem;
      background: color-mix(in srgb, var(--bg-core) 60%, var(--bg));
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .product h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--fg);
    }
    .product .desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }
    .product .price {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--accent);
    }
    .theme-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 50%;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.2rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .theme-toggle:hover { transform: scale(1.08); background: rgba(184,134,11,0.1); }
    .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
  <script>
    /* Apply saved theme before paint. Default is light; only go dark if explicitly chosen. */
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark mode" title="Toggle theme"></button>
  <main class="card">
    <h1><span class="domain">anantyaveda</span>.in</h1>
    <p class="tagline">Our website is currently under construction.<br />Please check back soon.</p>
    <span class="badge">Under Construction</span>
    <div class="social">
      <a class="social-link" href="https://instagram.com/anantyaveda_9" target="_blank" rel="noopener noreferrer">Instagram: @anantyaveda_9</a>
    </div>
    <section class="products" aria-labelledby="products-heading">
      <div class="tablist" role="tablist" aria-label="Product categories">
        <button class="tab" role="tab" aria-selected="true" data-cat="all">All</button>
        <button class="tab" role="tab" aria-selected="false" data-cat="skin">Skin Care</button>
      </div>
      <div class="grid" id="productGrid"></div>
    </section>
    <div class="footer">&copy; <span id="year"></span> anantyaveda.in</div>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      var btn = document.getElementById('themeToggle');
      function sync() {
        var isDark = document.documentElement.classList.contains('dark');
        btn.textContent = isDark ? '☀' : '☾'; /* sun when dark, moon when light */
        btn.title = isDark ? 'Switch to light mode' : 'Switch to dark mode';
      }
      sync();
      btn.addEventListener('click', function () {
        var nowDark = document.documentElement.classList.toggle('dark');
        try { localStorage.setItem('theme', nowDark ? 'dark' : 'light'); } catch (e) {}
        sync();
      });
    })();

    /* Product list with category tabs */
    (function () {
      var products = [
        { name: 'Shat Dhaut Ghrit', cat: 'skin', desc: '100x-washed medicated ghee — cooling, deeply healing clarified butter for sensitive and irritated skin.', price: '30g ₹499 · 50g ₹599' },
        { name: 'Lip Balm', cat: 'skin', desc: 'Nourishing herbal lip balm that softens and protects dry, chapped lips.', price: '₹199' },
        { name: 'Manjishtha Mulethi Cream', cat: 'skin', desc: 'Brightening cream with manjishtha and liquorice (mulethi) for even, glowing skin tone.', price: '30g ₹599 · 50g ₹699' },
        { name: 'Manjishtha Lip Balm', cat: 'skin', desc: 'Tinted herbal lip balm enriched with manjishtha for naturally rosy lips.', price: '₹199' },
        { name: 'Manjishtha Soap', cat: 'skin', desc: 'Ayurvedic cleansing bar with manjishtha to clarify and brighten the skin.', price: '₹199' }
      ];
      var grid = document.getElementById('productGrid');
      function render(cat) {
        grid.innerHTML = '';
        products.filter(function (p) { return cat === 'all' || p.cat === cat; })
          .forEach(function (p) {
            var card = document.createElement('div');
            card.className = 'product';
            card.innerHTML =
              '<h3>' + p.name + '</h3>' +
              '<p class="desc">' + p.desc + '</p>' +
              '<span class="price">' + p.price + '</span>';
            grid.appendChild(card);
          });
      }
      var tabs = document.querySelectorAll('.tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.setAttribute('aria-selected', 'false'); });
          tab.setAttribute('aria-selected', 'true');
          render(tab.getAttribute('data-cat'));
        });
      });
      render('all');
    })();
  </script>
</body>
</html>
